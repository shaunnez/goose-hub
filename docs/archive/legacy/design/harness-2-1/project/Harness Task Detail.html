<title>Harness — Task Detail</title>
<style id="tokens-inline">
/* Harness — design tokens (Apple/Win11 inspired, dark-first) */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root {
  /* Type */
  --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, "Cascadia Mono", monospace;

  /* Type scale (production-feel — no micro text) */
  --t-xs: 11.5px;   /* meta/labels — used sparingly */
  --t-sm: 12.5px;   /* secondary UI */
  --t-base: 13.5px; /* body */
  --t-md: 14.5px;
  --t-lg: 16px;
  --t-xl: 18px;
  --t-2xl: 22px;
  --t-3xl: 28px;

  /* Spacing */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-8: 32px;
  --s-10: 40px;
  --s-12: 48px;

  /* Radii */
  --r-sm: 5px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;

  /* Motion */
  --motion-fast: 140ms cubic-bezier(0.2, 0.7, 0.3, 1);
  --motion: 200ms cubic-bezier(0.2, 0.7, 0.3, 1);
  --motion-slow: 320ms cubic-bezier(0.2, 0.7, 0.3, 1);
  --spring: 380ms cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Dark theme (default) — cool slate */
:root, .theme-dark, [data-theme="dark"] {
  --bg: oklch(0.16 0.005 260);
  --bg-elev: oklch(0.19 0.006 260);
  --bg-elev-2: oklch(0.22 0.007 260);
  --bg-glass: oklch(0.18 0.005 260 / 0.72);
  --bg-hover: oklch(0.24 0.008 260);
  --bg-active: oklch(0.28 0.01 260);

  --fg: oklch(0.96 0.005 260);
  --fg-2: oklch(0.78 0.008 260);
  --fg-3: oklch(0.58 0.01 260);
  --fg-4: oklch(0.42 0.01 260);

  --line: oklch(0.28 0.01 260);
  --line-2: oklch(0.34 0.012 260);
  --line-strong: oklch(0.42 0.014 260);

  --accent: oklch(0.68 0.16 264);
  --accent-fg: oklch(0.18 0.04 264);
  --accent-soft: oklch(0.68 0.16 264 / 0.14);
  --accent-soft-2: oklch(0.68 0.16 264 / 0.22);
  --accent-line: oklch(0.68 0.16 264 / 0.42);

  --success: oklch(0.74 0.16 152);
  --warning: oklch(0.78 0.14 78);
  --danger: oklch(0.66 0.20 22);
  --info: oklch(0.74 0.12 220);

  /* persona hues — share chroma & lightness, vary hue */
  --p-aster: oklch(0.74 0.13 200); /* cyan — researcher */
  --p-vega:  oklch(0.74 0.13 290); /* violet — researcher */
  --p-bram:  oklch(0.74 0.13 32);  /* warm orange — dev */
  --p-niko:  oklch(0.74 0.13 142); /* green — qa */
  --p-cyra:  oklch(0.74 0.13 340); /* magenta — pm */

  --shadow-sm: 0 1px 0 oklch(0 0 0 / 0.4), 0 1px 2px oklch(0 0 0 / 0.2);
  --shadow-md: 0 8px 24px oklch(0 0 0 / 0.32), 0 2px 4px oklch(0 0 0 / 0.16);
  --shadow-lg: 0 24px 64px oklch(0 0 0 / 0.5), 0 4px 12px oklch(0 0 0 / 0.24);
  --shadow-inset: inset 0 1px 0 oklch(1 0 0 / 0.04);

  --code-add: oklch(0.32 0.08 152 / 0.4);
  --code-add-line: oklch(0.74 0.16 152 / 0.5);
  --code-del: oklch(0.32 0.10 22 / 0.4);
  --code-del-line: oklch(0.66 0.20 22 / 0.5);
  --code-num: oklch(0.42 0.01 260);
}

/* Light theme — warm whisper of cream, not pure white */
.theme-light, [data-theme="light"] {
  --bg: oklch(0.985 0.003 80);
  --bg-elev: oklch(1 0 0);
  --bg-elev-2: oklch(0.97 0.004 80);
  --bg-glass: oklch(1 0 0 / 0.72);
  --bg-hover: oklch(0.96 0.005 260);
  --bg-active: oklch(0.93 0.008 260);

  --fg: oklch(0.22 0.01 260);
  --fg-2: oklch(0.42 0.01 260);
  --fg-3: oklch(0.58 0.008 260);
  --fg-4: oklch(0.72 0.005 260);

  --line: oklch(0.92 0.005 260);
  --line-2: oklch(0.86 0.006 260);
  --line-strong: oklch(0.78 0.008 260);

  --accent: oklch(0.54 0.18 264);
  --accent-fg: oklch(0.99 0 0);
  --accent-soft: oklch(0.54 0.18 264 / 0.10);
  --accent-soft-2: oklch(0.54 0.18 264 / 0.18);
  --accent-line: oklch(0.54 0.18 264 / 0.4);

  --success: oklch(0.52 0.16 152);
  --warning: oklch(0.62 0.16 64);
  --danger: oklch(0.54 0.20 22);
  --info: oklch(0.52 0.14 220);

  --p-aster: oklch(0.54 0.13 200);
  --p-vega:  oklch(0.54 0.13 290);
  --p-bram:  oklch(0.58 0.15 32);
  --p-niko:  oklch(0.52 0.13 142);
  --p-cyra:  oklch(0.54 0.15 340);

  --shadow-sm: 0 1px 0 oklch(0 0 0 / 0.04), 0 1px 2px oklch(0 0 0 / 0.06);
  --shadow-md: 0 4px 14px oklch(0 0 0 / 0.06), 0 1px 3px oklch(0 0 0 / 0.05);
  --shadow-lg: 0 24px 48px oklch(0 0 0 / 0.08), 0 4px 12px oklch(0 0 0 / 0.06);
  --shadow-inset: inset 0 1px 0 oklch(1 0 0 / 0.6);

  --code-add: oklch(0.94 0.04 152 / 0.7);
  --code-add-line: oklch(0.62 0.14 152 / 0.5);
  --code-del: oklch(0.94 0.04 22 / 0.7);
  --code-del-line: oklch(0.6 0.18 22 / 0.5);
  --code-num: oklch(0.62 0.008 260);
}

/* Density — scales typography and spacing globally.
   --d-scale multiplies card padding & gaps via the calc()s below.
   font-size on :root rescales every rem-based size; we also nudge
   the 13.5px body baseline by class so px-sized text shifts too. */
.density-comfortable { --d-scale: 1.18; --row-h: 36px; }
.density-balanced    { --d-scale: 1.00; --row-h: 30px; }
.density-dense       { --d-scale: 0.86; --row-h: 26px; }

.density-comfortable body { font-size: 14.5px; }
.density-balanced    body { font-size: 13.5px; }
.density-dense       body { font-size: 12.5px; }

/* Component-level reactions to density */
.density-dense .btn      { height: 26px; padding: 0 10px; font-size: 11.5px; }
.density-dense .btn.sm   { height: 22px; padding: 0 7px; font-size: 11px; }
.density-comfortable .btn    { height: 34px; padding: 0 14px; font-size: 13.5px; }
.density-comfortable .btn.sm { height: 30px; padding: 0 11px; font-size: 12.5px; }

.density-dense .pill        { height: 19px; padding: 0 7px; font-size: 10.5px; }
.density-comfortable .pill  { height: 25px; padding: 0 11px; font-size: 12px; }

.density-dense .avatar      { width: 22px; height: 22px; font-size: 9.5px; }
.density-dense .avatar.lg   { width: 28px; height: 28px; font-size: 10.5px; }
.density-dense .avatar.sm   { width: 18px; height: 18px; font-size: 9px; }
.density-comfortable .avatar    { width: 28px; height: 28px; font-size: 11px; }
.density-comfortable .avatar.lg { width: 36px; height: 36px; font-size: 12.5px; }
.density-comfortable .avatar.sm { width: 22px; height: 22px; font-size: 10px; }

.density-dense .card        { border-radius: 6px; }
.density-comfortable .card  { border-radius: 10px; }

/* Scale gap utility classes by density */
.density-dense .gap-2 { gap: 6px; } .density-dense .gap-3 { gap: 9px; } .density-dense .gap-4 { gap: 12px; } .density-dense .gap-6 { gap: 18px; }
.density-comfortable .gap-2 { gap: 10px; } .density-comfortable .gap-3 { gap: 14px; } .density-comfortable .gap-4 { gap: 20px; } .density-comfortable .gap-6 { gap: 28px; }

/* Section header scales with density */
.density-dense .section-h        { font-size: 16px; }
.density-comfortable .section-h  { font-size: 20px; }

/* Accent variants — override hue */
[data-accent="indigo"] { --accent: oklch(0.68 0.16 264); --accent-fg: oklch(0.18 0.04 264); --accent-soft: oklch(0.68 0.16 264 / 0.14); --accent-soft-2: oklch(0.68 0.16 264 / 0.22); --accent-line: oklch(0.68 0.16 264 / 0.42); }
[data-accent="violet"] { --accent: oklch(0.7 0.18 300); --accent-fg: oklch(0.18 0.04 300); --accent-soft: oklch(0.7 0.18 300 / 0.14); --accent-soft-2: oklch(0.7 0.18 300 / 0.22); --accent-line: oklch(0.7 0.18 300 / 0.42); }
[data-accent="cyan"]   { --accent: oklch(0.78 0.13 200); --accent-fg: oklch(0.18 0.04 200); --accent-soft: oklch(0.78 0.13 200 / 0.14); --accent-soft-2: oklch(0.78 0.13 200 / 0.22); --accent-line: oklch(0.78 0.13 200 / 0.42); }
[data-accent="amber"]  { --accent: oklch(0.78 0.14 78); --accent-fg: oklch(0.2 0.04 78); --accent-soft: oklch(0.78 0.14 78 / 0.14); --accent-soft-2: oklch(0.78 0.14 78 / 0.22); --accent-line: oklch(0.78 0.14 78 / 0.42); }
[data-theme="light"][data-accent="indigo"] { --accent: oklch(0.54 0.18 264); --accent-fg: oklch(0.99 0 0); --accent-soft: oklch(0.54 0.18 264 / 0.10); --accent-soft-2: oklch(0.54 0.18 264 / 0.18); --accent-line: oklch(0.54 0.18 264 / 0.4); }
[data-theme="light"][data-accent="violet"] { --accent: oklch(0.5 0.2 300); --accent-fg: oklch(0.99 0 0); --accent-soft: oklch(0.5 0.2 300 / 0.10); --accent-soft-2: oklch(0.5 0.2 300 / 0.18); --accent-line: oklch(0.5 0.2 300 / 0.4); }
[data-theme="light"][data-accent="cyan"]   { --accent: oklch(0.5 0.14 200); --accent-fg: oklch(0.99 0 0); --accent-soft: oklch(0.5 0.14 200 / 0.10); --accent-soft-2: oklch(0.5 0.14 200 / 0.18); --accent-line: oklch(0.5 0.14 200 / 0.4); }
[data-theme="light"][data-accent="amber"]  { --accent: oklch(0.6 0.16 64); --accent-fg: oklch(0.99 0 0); --accent-soft: oklch(0.6 0.16 64 / 0.10); --accent-soft-2: oklch(0.6 0.16 64 / 0.18); --accent-line: oklch(0.6 0.16 64 / 0.4); }

/* Reduced motion */
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after {
  animation-duration: 1ms !important;
  transition-duration: 80ms !important;
}

/* Reset + base */
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--fg);
  font-size: var(--t-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.005em;
  font-feature-settings: "cv11", "ss01";
  overflow: hidden;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }

/* Utility classes */
.mono { font-family: var(--font-mono); letter-spacing: -0.01em; font-feature-settings: "ss02", "cv11"; }
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-6 { gap: 24px; }
.grow { flex: 1 1 auto; min-width: 0; min-height: 0; }
.nowrap { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Pill */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 22px; padding: 0 9px;
  border-radius: 999px;
  font-size: var(--t-xs); font-weight: 500;
  border: 1px solid var(--line);
  color: var(--fg-2);
  background: var(--bg-elev);
  letter-spacing: 0;
  white-space: nowrap;
}
.pill.sm { height: 19px; padding: 0 7px; font-size: 11px; }
.pill.accent { border-color: var(--accent-line); color: var(--accent); background: var(--accent-soft); }
.pill.success { border-color: oklch(from var(--success) l c h / 0.4); color: var(--success); background: oklch(from var(--success) l c h / 0.12); }
.pill.warning { border-color: oklch(from var(--warning) l c h / 0.4); color: var(--warning); background: oklch(from var(--warning) l c h / 0.12); }
.pill.danger  { border-color: oklch(from var(--danger)  l c h / 0.4); color: var(--danger);  background: oklch(from var(--danger)  l c h / 0.12); }

.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: var(--fg-3); display: inline-block; }
.dot.live { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft-2); }
  50%      { box-shadow: 0 0 0 5px transparent; }
}

/* Kbd */
.kbd {
  font-family: var(--font-mono);
  font-size: 10.5px;
  padding: 1px 6px;
  border: 1px solid var(--line);
  border-bottom-width: 1.5px;
  border-radius: 4px;
  color: var(--fg-2);
  background: var(--bg-elev);
  line-height: 1.5;
  min-width: 16px;
  text-align: center;
  display: inline-block;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  height: 30px; padding: 0 12px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--bg-elev);
  color: var(--fg);
  font-size: var(--t-sm); font-weight: 500;
  cursor: pointer;
  transition: background var(--motion-fast), border-color var(--motion-fast), transform var(--motion-fast);
  white-space: nowrap;
}
.btn:hover { background: var(--bg-hover); border-color: var(--line-2); }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; box-shadow: var(--shadow-inset), 0 1px 2px oklch(0 0 0 / 0.2); }
.btn.primary:hover { background: oklch(from var(--accent) calc(l + 0.04) c h); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--bg-hover); }
.btn.sm { height: 26px; padding: 0 9px; font-size: var(--t-xs); }

/* Card surfaces */
.card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-sm);
}

/* Glass surface */
.glass {
  background: var(--bg-glass);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--line);
}

/* Scrollbars */
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: oklch(from var(--fg-3) l c h / 0.25);
  border: 2px solid transparent;
  background-clip: content-box;
  border-radius: 999px;
}
*::-webkit-scrollbar-thumb:hover { background: oklch(from var(--fg-3) l c h / 0.4); background-clip: content-box; border: 2px solid transparent; }

/* Section enter animation */
@keyframes section-in {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.section-anim { animation: section-in 240ms cubic-bezier(0.2, 0.7, 0.3, 1); }

/* Rail item active stripe */
@keyframes stripe-in { from { transform: scaleY(0.3); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }

/* Diff hunks */
.diff-line { display: grid; grid-template-columns: 44px 44px 1fr; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; }
.diff-line .ln { color: var(--code-num); text-align: right; padding-right: 10px; user-select: none; font-variant-numeric: tabular-nums; }
.diff-line.add { background: var(--code-add); }
.diff-line.add .ln { color: var(--code-add-line); }
.diff-line.del { background: var(--code-del); }
.diff-line.del .ln { color: var(--code-del-line); }
.diff-line .code { padding-left: 12px; white-space: pre; overflow-x: auto; }

/* Token highlight (very light syntax) */
.tok-kw { color: oklch(0.74 0.13 290); }
.tok-fn { color: oklch(0.78 0.13 200); }
.tok-str { color: oklch(0.78 0.13 64); }
.tok-num { color: oklch(0.74 0.13 32); }
.tok-com { color: var(--fg-3); font-style: italic; }
.tok-typ { color: oklch(0.78 0.10 142); }
.theme-light .tok-kw { color: oklch(0.46 0.18 290); }
.theme-light .tok-fn { color: oklch(0.5 0.14 220); }
.theme-light .tok-str { color: oklch(0.46 0.14 32); }
.theme-light .tok-num { color: oklch(0.5 0.18 22); }
.theme-light .tok-com { color: var(--fg-3); }
.theme-light .tok-typ { color: oklch(0.46 0.14 142); }

/* Avatar */
.avatar {
  width: 24px; height: 24px; border-radius: 50%;
  display: inline-grid; place-items: center;
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0;
  color: oklch(0.18 0 0);
  flex-shrink: 0;
}
.avatar.lg { width: 32px; height: 32px; font-size: 11.5px; }
.avatar.sm { width: 20px; height: 20px; font-size: 9.5px; }
.avatar.aster { background: var(--p-aster); }
.avatar.vega  { background: var(--p-vega); }
.avatar.bram  { background: var(--p-bram); }
.avatar.niko  { background: var(--p-niko); }
.avatar.cyra  { background: var(--p-cyra); }

/* Subtle divider */
.divider { height: 1px; background: var(--line); width: 100%; }

/* Section header */
.section-h {
  font-size: var(--t-xl);
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--fg);
}
.section-sub { font-size: var(--t-sm); color: var(--fg-3); letter-spacing: 0; }
.eyebrow { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }

/* Tabs underline */
.fade-mask {
  -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent);
          mask-image: linear-gradient(to bottom, black 80%, transparent);
}

/* Focus ring */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Specific tweak: tabular numbers everywhere it matters */
.tnum { font-variant-numeric: tabular-nums; }

</style>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #28292d; color: #f4f4f5; font-family: var(--font-ui); }
  html, body { background: var(--bg); color: var(--fg); }
  * { box-sizing: border-box; }
  #root, .app { height: 100%; }
  .app { display: flex; flex-direction: column; min-height: 0; }

  @media (max-width: 759px) {

    .mobile-nav-btn { display: flex; }

  html.force-mobile .body { position: relative; }
  html.force-mobile .body > nav { display: none !important; }
  html.force-mobile .body > aside { display: none !important; }
  html.force-mobile .mobile-nav-btn { display: flex !important; }

  .mobile-nav-btn {
    position: fixed; bottom: 18px; right: 18px; z-index: 40;
    width: 48px; height: 48px; border-radius: 24px;
    background: var(--accent); color: var(--accent-fg);

    display: none; align-items: center; justify-content: center;
    cursor: pointer;
  }

    display: none; align-items: flex-end;
  }
  .mobile-nav-sheet[data-open="true"] { display: flex; }
  .mobile-nav-sheet__panel {
    width: 100%; max-height: 70vh; overflow: auto;

    border-top: 1px solid var(--line);

    width: 36px; height: 4px; border-radius: 2px; background: var(--line-2);
    margin: 4px auto 12px;
  }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

})();

</script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;
const D = window.HARNESS_DATA;

class SectionBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidUpdate(prev) { if (prev.k !== this.props.k && this.state.err) this.setState({ err: null }); }
  render() {
    if (this.state.err) {
      return (
        <div style={{ padding: 36, maxWidth: 720, margin: '40px auto' }}>
          <div className="eyebrow" style={{ color: 'var(--danger)' }}>Section error</div>
          <div style={{ fontSize: 18, fontWeight: 600, marginTop: 6 }}>This section failed to render.</div>
          <pre className="mono" style={{
            marginTop: 12, padding: 14, fontSize: 12,
            background: 'var(--bg-elev-2)', border: '1px solid var(--line)', borderRadius: 8,
            color: 'var(--fg-2)', whiteSpace: 'pre-wrap',
          }}>{String(this.state.err && this.state.err.message || this.state.err)}</pre>
        </div>
      );
    }
    return this.props.children;
  }
}

const SECTION_RENDERERS = {
  overview: (props) => <window.Sec.Overview {...props} />,
  repo:     () => <window.Sec.RepoSelection />,
  invest:   () => <window.Sec.Investigation />,
  prd:      () => <window.Sec.PRD />,
  code:     () => <window.Sec.Code />,
  qa:       () => <window.Sec.QA />,
  review:   () => <window.Sec.Review />,
  timeline: () => <window.Sec.Timeline />,
  chat:     () => <window.Sec.Chat />,
  costs:    () => <window.Sec.Costs />,
};

const TWEAKS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "density": "balanced",
  "accent": "indigo",
  "rail_expanded": true,
  "right_rail": false
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweaks] = window.useTweaks ? window.useTweaks(TWEAKS) : useState(TWEAKS);
  const setTweak = window.useTweaks ? setTweaks : (kOrObj, v) => {
    const updates = typeof kOrObj === 'string' ? { [kOrObj]: v } : kOrObj;
    setTweaks(s => ({ ...s, ...updates }));
  };

  const [active, setActive] = useState('overview');
  const [view, setView] = useState('detail'); // 'board' | 'detail'
  const [railExpanded, setRailExpanded] = useState(tweaks.rail_expanded);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const forceMobile = !!tweaks.force_mobile;
  const [isMobile, setIsMobile] = useState(forceMobile || (typeof window !== 'undefined' && window.innerWidth < 760));

  useEffect(() => {
    const onResize = () => setIsMobile(forceMobile || window.innerWidth < 760);
    onResize();
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, [forceMobile]);

  // Apply force-mobile class on root so CSS media query is bypassed
  useEffect(() => {
    document.documentElement.classList.toggle('force-mobile', forceMobile);
  }, [forceMobile]);

  // Apply theme + accent
  useEffect(() => {
    const root = document.documentElement;
    root.dataset.theme = tweaks.theme === 'light' ? 'light' : 'dark';
    root.dataset.accent = tweaks.accent || 'indigo';
    root.dataset.density = tweaks.density || 'balanced';
    // Density classes (CSS uses .density-X selectors)
    root.classList.remove('density-dense', 'density-balanced', 'density-comfortable');
    root.classList.add(`density-${tweaks.density || 'balanced'}`);
    // Theme class (CSS also accepts .theme-light)
    root.classList.toggle('theme-light', tweaks.theme === 'light');
    root.classList.toggle('theme-dark', tweaks.theme !== 'light');
  }, [tweaks.theme, tweaks.accent, tweaks.density]);

  // Keyboard shortcuts: g+letter to jump
  useEffect(() => {
    let g = false; let timer = null;
    const onKey = (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'g') { g = true; clearTimeout(timer); timer = setTimeout(() => g = false, 800); return; }
      if (g) {
        const map = { o: 'overview', r: 'repo', i: 'invest', p: 'prd', c: 'code',
                      q: 'qa', v: 'review', t: 'timeline', m: 'chat', $: 'costs' };
        if (map[e.key]) { setActive(map[e.key]); g = false; }
      }
      if (e.key === '[' && (e.metaKey || e.ctrlKey)) {
        const i = D.sections.findIndex(s => s.k === active);
        if (i > 0) setActive(D.sections[i - 1].k);
      }
      if (e.key === ']' && (e.metaKey || e.ctrlKey)) {
        const i = D.sections.findIndex(s => s.k === active);
        if (i >= 0 && i < D.sections.length - 1) setActive(D.sections[i + 1].k);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [active]);

  return (
    <div className="app" data-screen-label="Harness Task Detail">
      {view === 'board' ? (
        <window.BoardView onOpenTask={(t) => { setView('detail'); setActive('overview'); }} />
      ) : (
        <>
          <window.BreadcrumbBar
            task={D.task}
            onBack={() => setView('board')}
            theme={tweaks.theme}
            onTheme={() => setTweak('theme', tweaks.theme === 'dark' ? 'light' : 'dark')}
          />
          <window.TaskHeader task={D.task} personas={D.personas} />
          <div className="body">
            <window.LeftRail
              sections={D.sections}
              active={active}
              onChange={setActive}
              expanded={railExpanded}
              onExpandToggle={() => setRailExpanded(e => !e)}
            />
            <main className="scroll" data-screen-label={`Section · ${active}`}>
              <SectionBoundary k={active}>
                {(SECTION_RENDERERS[active] || (() => null))({ go: setActive })}
              </SectionBoundary>
            </main>
            {tweaks.right_rail && <window.RightRail ticker={D.ticker} personas={D.personas} />}
          </div>

          {/* Mobile nav: floating button + bottom sheet */}
          <button className="mobile-nav-btn" aria-label="Sections" onClick={() => setMobileNavOpen(true)}>
            <window.Icons.Layers size={18} />
          </button>
          <div className="mobile-nav-sheet" data-open={mobileNavOpen} onClick={(e) => { if (e.target.classList.contains('mobile-nav-sheet')) setMobileNavOpen(false); }}>
            <div className="mobile-nav-sheet__panel">
              <div className="mobile-nav-sheet__handle" />
              <div className="eyebrow" style={{ padding: '6px 14px 10px' }}>Sections</div>
              {D.sections.map(s => {
                const isActive = active === s.k;
                return (
                  <button key={s.k} onClick={() => { setActive(s.k); setMobileNavOpen(false); }} style={{
                    display: 'flex', alignItems: 'center', gap: 12, width: '100%',
                    padding: '12px 16px', border: 'none', background: isActive ? 'var(--accent-soft)' : 'transparent',
                    borderRadius: 8, textAlign: 'left', cursor: 'pointer', minHeight: 44,
                  }}>
                    <span className="mono" style={{ width: 20, fontSize: 11, color: 'var(--fg-3)' }}>{String(s.n).padStart(2, '0')}</span>
                    <span style={{ fontSize: 14.5, color: isActive ? 'var(--fg)' : 'var(--fg-2)', fontWeight: isActive ? 600 : 500 }}>{s.label}</span>
                  </button>
                );
              })}
            </div>
          </div>
        </>
      )}

      {window.TweaksPanel && (
        <window.TweaksPanel title="Tweaks">
          <window.TweakSection title="Appearance">
            <window.TweakRadio label="Theme" value={tweaks.theme} options={[
              { value: 'dark', label: 'Dark' }, { value: 'light', label: 'Light' }
            ]} onChange={(v) => setTweak('theme', v)} />
            <window.TweakSelect label="Accent" value={tweaks.accent} options={[
              { value: 'indigo', label: 'Indigo' }, { value: 'violet', label: 'Violet' }, { value: 'cyan', label: 'Cyan' }, { value: 'amber', label: 'Amber' }
            ]} onChange={(v) => setTweak('accent', v)} />
            <window.TweakRadio label="Density" value={tweaks.density} options={[
              { value: 'dense', label: 'Dense' }, { value: 'balanced', label: 'Balanced' }, { value: 'comfortable', label: 'Comfy' }
            ]} onChange={(v) => setTweak('density', v)} />
          </window.TweakSection>
          <window.TweakSection title="View">
            <window.TweakRadio label="Surface" value={view} options={[
              { value: 'detail', label: 'Task detail' }, { value: 'board', label: 'Board' }
            ]} onChange={setView} />
          </window.TweakSection>
          <window.TweakSection title="Layout">
            <window.TweakToggle label="Force mobile view" value={!!tweaks.force_mobile} onChange={(v) => setTweak('force_mobile', v)} />
            <window.TweakToggle label="Right rail" value={tweaks.right_rail} onChange={(v) => setTweak('right_rail', v)} />
            <window.TweakToggle label="Left rail expanded" value={railExpanded} onChange={setRailExpanded} />
          </window.TweakSection>
        </window.TweaksPanel>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
